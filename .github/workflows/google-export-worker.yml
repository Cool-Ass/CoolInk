name: Google export worker
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: coolink-google-export-worker
  cancel-in-progress: false
jobs:
  export:
    if: github.repository == 'Cool-Ass/CoolInk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main, persist-credentials: false }
      - name: Consume due export jobs with short-lived GitHub identity
        shell: bash
        run: |
          node <<'JS'
          const endpoint = 'https://www.coolinktattoo.pl/api/cron/google-exports';
          async function main() {
            const { trustedWorkerHeaders } = await import('./scripts/trustedWorkerHeaders.mjs');
            const identityHeaders = await trustedWorkerHeaders(endpoint, token => console.log('::add-mask::' + token));
            const response = await fetch(endpoint, {
              method: 'POST', headers: identityHeaders, redirect: 'error',
              signal: AbortSignal.timeout(290000),
            });
            if (!response.ok) throw new Error(`Export worker HTTP ${response.status}`);
            const result = await response.json();
            if (result.ok !== true) throw new Error('Export worker did not confirm execution');
            console.log(JSON.stringify({ checked: result.checked, synced: result.synced }));
          }
          main().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
