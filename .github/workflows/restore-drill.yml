name: Quarterly restore drill
on:
  schedule:
    - cron: "41 4 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      private_media:
        description: "Approved private isolated media restoration; manual only, no production writes"
        default: false
        type: boolean
      backup_run_id:
        description: "Successful saved backup run ID (empty = latest successful main backup)"
        required: false
        type: string
      audit_preflight:
        description: "Diagnostic only: restore the explicitly approved 2026-10-02 branch backup; never a production publication gate"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-test
          POSTGRES_DB: coolink_restore
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Validate backup configuration
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test "${#BACKUP_ENCRYPTION_PASSWORD}" -ge 32 || { echo "::error::BACKUP_ENCRYPTION_PASSWORD must contain at least 32 characters"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/coolink-pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Select saved backup artifact
        id: backup
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REQUESTED_RUN: ${{ inputs.backup_run_id }}
          AUDIT_PREFLIGHT: ${{ inputs.audit_preflight }}
        with:
          script: |
            const requested = process.env.REQUESTED_RUN;
            let run;
            if (requested) {
              if (!/^[0-9]+$/.test(requested)) throw new Error("Invalid backup run ID");
              run = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(requested) })).data;
            } else {
              const runs = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: "backup.yml", branch: "main", status: "success", per_page: 1 });
              run = runs.data.workflow_runs[0];
            }
            const preflight = process.env.AUDIT_PREFLIGHT === "true";
            const approvedPreflight = preflight && context.eventName === "workflow_dispatch"
              && context.ref === "refs/heads/ai/audit-sync-outbox" && requested === "36953435073"
              && run?.head_branch === "ai/audit-sync-outbox"
              && run?.head_sha === "255564a10a1f06b302a07b1500d1d215674bcd2e";
            if (preflight && !approvedPreflight) throw new Error("Unapproved diagnostic backup");
            if (!run || run.conclusion !== "success" || (!approvedPreflight && run.head_branch !== "main") || run.path !== ".github/workflows/backup.yml") throw new Error("No trusted successful backup");
            if (Date.now() - Date.parse(run.created_at) > 90 * 86400000) throw new Error("Backup is older than retention");
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: run.id });
            const name = "coolink-encrypted-backup-" + run.id;
            if (!artifacts.some(a => a.name === name && !a.expired)) throw new Error("Saved backup artifact is missing/expired");
            core.setOutput("run_id", String(run.id));
            core.setOutput("name", name);
            await core.summary.addHeading(preflight ? "AUDIT PREFLIGHT — not a production publication gate" : "Saved backup restore drill").addLink("Source backup", run.html_url).addRaw("\\nNo production database connection used.").write();
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.backup.outputs.name }}
          run-id: ${{ steps.backup.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify, decrypt and unpack saved archive
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          sha256sum --check SHA256SUMS.txt
          mkdir restored
          openssl enc -d -aes-256-cbc -pbkdf2 -in coolink-backup.enc -out restored/backup.tar.gz -pass env:BACKUP_ENCRYPTION_PASSWORD
          tar -xzf restored/backup.tar.gz -C restored --no-same-owner
      - name: Restore and verify database
        env:
          PGPASSWORD: restore-test
        run: |
          pg_restore --exit-on-error --clean --if-exists --host=localhost --username=postgres --dbname=coolink_restore --no-owner --no-privileges restored/production.dump
          psql --host=localhost --username=postgres --dbname=coolink_restore --no-psqlrc --quiet --tuples-only --no-align --set=ON_ERROR_STOP=1 --file=scripts/backupCounts.sql > restored-counts.txt
          # Source and restore servers can use different database collations.
          LC_ALL=C sort restored/expected-counts.txt > expected-counts.sorted.txt
          LC_ALL=C sort restored-counts.txt > restored-counts.sorted.txt
          diff --unified expected-counts.sorted.txt restored-counts.sorted.txt
      - name: Restore protected schemas in disposable offline database only
        env:
          PGPASSWORD: restore-test
          PGOPTIONS: "-c session_replication_role=replica"
        run: |
          if [ ! -f restored/protected.dump ]; then
            echo "::error::Legacy public-only artifact: Auth recovery NOT verified."
            exit 1
          fi
          umask 077
          psql --host=localhost --username=postgres --dbname=coolink_restore -Xq -v ON_ERROR_STOP=1 -f scripts/offlineSupabaseRoles.sql
          if ! pg_restore --exit-on-error --host=localhost --username=postgres --dbname=coolink_restore --no-owner --no-privileges restored/protected.dump > protected-restore.private.log 2>&1; then
            echo "::error::Protected schema restore failed; private diagnostics withheld."
            node -e 'const fs=require("fs"); const text=fs.readFileSync("protected-restore.private.log","utf8"); const role=text.match(/role "(anon|authenticated|service_role|supabase_auth_admin|supabase_storage_admin|supabase_admin|dashboard_user)" does not exist/); if(role) console.error("OFFLINE_ROLE_MISSING", role[1]); else console.error("OFFLINE_PROTECTED_RESTORE_FAILED");'
            exit 1
          fi
          psql --host=localhost --username=postgres --dbname=coolink_restore -XqAt -v ON_ERROR_STOP=1 -f scripts/backupProtectedCounts.sql > protected-restored-counts.txt
          LC_ALL=C sort restored/protected-counts.txt > protected-expected.sorted
          LC_ALL=C sort protected-restored-counts.txt > protected-actual.sorted
          if ! cmp -s protected-expected.sorted protected-actual.sorted; then
            echo "::error::Protected schema counts differ."
            exit 1
          fi
          echo "PASS protected schema record counts in disposable local PostgreSQL; Auth login/config not yet verified."
      - name: Verify restored media byte-for-byte
        run: node scripts/verifyMediaBackup.mjs restored/media-backup
      - name: Verify restored Auth inventory and isolated password login
        run: |
          if [ ! -d restored/runtime-config ]; then
            node scripts/verifyRestoredAuth.mjs
          fi
      - name: Verify sealed runtime configuration when captured
        env:
          DRILL_MEDIA_RESTORE: ${{ github.event_name == 'workflow_dispatch' && inputs.private_media == true && '1' || '0' }}
          DRILL_BLOB_READ_WRITE_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.private_media == true && secrets.DRILL_BLOB_READ_WRITE_TOKEN || '' }}
        run: |
          if [ -d restored/runtime-config ]; then
            node scripts/backupRuntimeConfiguration.mjs verify restored/runtime-config
            npx tsx scripts/verifyRestoredCrypto.ts
          else
            echo "::warning::Runtime configuration not captured; full Auth/application recovery remains unverified."
          fi
