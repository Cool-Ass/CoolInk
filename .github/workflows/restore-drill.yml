name: Quarterly restore drill
on:
  schedule:
    - cron: "41 4 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "Successful saved backup run ID (empty = latest successful main backup)"
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-test
          POSTGRES_DB: coolink_restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Validate backup configuration
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test "${#BACKUP_ENCRYPTION_PASSWORD}" -ge 32 || { echo "::error::BACKUP_ENCRYPTION_PASSWORD must contain at least 32 characters"; exit 1; }
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/coolink-pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Select saved backup artifact
        id: backup
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN: ${{ inputs.backup_run_id }}
        with:
          script: |
            const requested = process.env.REQUESTED_RUN;
            let run;
            if (requested) {
              if (!/^[0-9]+$/.test(requested)) throw new Error("Invalid backup run ID");
              run = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(requested) })).data;
            } else {
              const runs = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: "backup.yml", branch: "main", status: "success", per_page: 1 });
              run = runs.data.workflow_runs[0];
            }
            if (!run || run.conclusion !== "success" || run.head_branch !== "main" || run.path !== ".github/workflows/backup.yml") throw new Error("No trusted successful main backup");
            if (Date.now() - Date.parse(run.created_at) > 90 * 86400000) throw new Error("Backup is older than retention");
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: run.id });
            const name = "coolink-encrypted-backup-" + run.id;
            if (!artifacts.some(a => a.name === name && !a.expired)) throw new Error("Saved backup artifact is missing/expired");
            core.setOutput("run_id", String(run.id));
            core.setOutput("name", name);
            await core.summary.addHeading("Saved backup restore drill").addLink("Source backup", run.html_url).addRaw("\\nNo production database connection used.").write();
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.backup.outputs.name }}
          run-id: ${{ steps.backup.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify, decrypt and unpack saved archive
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          sha256sum --check SHA256SUMS.txt
          mkdir restored
          openssl enc -d -aes-256-cbc -pbkdf2 -in coolink-backup.enc -out restored/backup.tar.gz -pass env:BACKUP_ENCRYPTION_PASSWORD
          tar -xzf restored/backup.tar.gz -C restored --no-same-owner
      - name: Restore and verify database
        env:
          PGPASSWORD: restore-test
        run: |
          pg_restore --exit-on-error --clean --if-exists --host=localhost --username=postgres --dbname=coolink_restore --no-owner --no-privileges restored/production.dump
          psql --host=localhost --username=postgres --dbname=coolink_restore --no-psqlrc --quiet --tuples-only --no-align --set=ON_ERROR_STOP=1 --file=scripts/backupCounts.sql > restored-counts.txt
          # Source and restore servers can use different database collations.
          LC_ALL=C sort restored/expected-counts.txt > expected-counts.sorted.txt
          LC_ALL=C sort restored-counts.txt > restored-counts.sorted.txt
          diff --unified expected-counts.sorted.txt restored-counts.sorted.txt
      - name: Verify restored media byte-for-byte
        run: node scripts/verifyMediaBackup.mjs restored/media-backup
