name: Quality and security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
concurrency:
  # All branches share one isolated test database: never reset it concurrently.
  group: coolink-isolated-integration-database
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Require isolated integration credentials
        env:
          TEST_DATABASE_URL: ${{ secrets.DRY_RUN_DIRECT_URL }}
          TEST_SUPABASE_URL: ${{ secrets.DRY_RUN_SUPABASE_URL }}
          TEST_SUPABASE_KEY: ${{ secrets.DRY_RUN_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ] || [ -z "$TEST_SUPABASE_URL" ] || [ -z "$TEST_SUPABASE_KEY" ]; then
            echo "::error::Required isolated integration credentials are missing. Integration verification has NOT passed."
            exit 1
          fi
      - run: npm run build
        env:
          DATABASE_URL: "${{ secrets.DRY_RUN_DIRECT_URL }}&connection_limit=2&pool_timeout=30"
          DIRECT_URL: "${{ secrets.DRY_RUN_DIRECT_URL }}&connection_limit=2&pool_timeout=30"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DRY_RUN_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DRY_RUN_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3120
          SESSION_SECRET: ci-only-session-secret-93bc5b557ea9451fbb290b1ad2af08ae
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Isolated database RLS, IDOR and role tests
        env:
          DRY_RUN_SUPABASE_URL: ${{ secrets.DRY_RUN_SUPABASE_URL }}
          DRY_RUN_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DRY_RUN_SUPABASE_PUBLISHABLE_KEY }}
          DRY_RUN_DIRECT_URL: "${{ secrets.DRY_RUN_DIRECT_URL }}&connection_limit=2&pool_timeout=30"
          DATABASE_URL: "${{ secrets.DRY_RUN_DIRECT_URL }}&connection_limit=2&pool_timeout=30"
          DIRECT_URL: "${{ secrets.DRY_RUN_DIRECT_URL }}&connection_limit=2&pool_timeout=30"
        run: |
          if [ -z "$DRY_RUN_SUPABASE_URL" ] || [ -z "$DRY_RUN_DIRECT_URL" ]; then
            echo "::error::Brak konfiguracji testów bazy."
            exit 1
          fi
          npm run db:test:prepare
          node scripts/verifyLoyaltyMigration.cjs
          node scripts/verifyMessageVisibilityMigration.cjs
          node scripts/verifyGoogleOutbox.cjs
          node scripts/verifyPrivacyExecutionGuard.cjs
          npm run db:security:audit
          npm run db:security:verify
          npm run db:security:http-verify
      - name: Isolated client and admin HTTP authorization tests
        env:
          CI: "true"
          DRY_RUN_SUPABASE_URL: ${{ secrets.DRY_RUN_SUPABASE_URL }}
          DRY_RUN_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DRY_RUN_SUPABASE_PUBLISHABLE_KEY }}
          DRY_RUN_DIRECT_URL: "${{ secrets.DRY_RUN_DIRECT_URL }}&connection_limit=2&pool_timeout=30"
          DATABASE_URL: "${{ secrets.DRY_RUN_DIRECT_URL }}&connection_limit=2&pool_timeout=30"
          DIRECT_URL: "${{ secrets.DRY_RUN_DIRECT_URL }}&connection_limit=2&pool_timeout=30"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DRY_RUN_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DRY_RUN_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3120
          SESSION_SECRET: ci-only-session-secret-93bc5b557ea9451fbb290b1ad2af08ae
          SMOKE_BASE_URL: http://127.0.0.1:3120
        run: |
          if [ -z "$DRY_RUN_SUPABASE_URL" ] || [ -z "$DRY_RUN_SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$DRY_RUN_DIRECT_URL" ]; then
            echo "::error::Brak konfiguracji testów HTTP."
            exit 1
          fi
          npm start -- --hostname 127.0.0.1 --port 3120 > /tmp/coolink-app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3120/ > /dev/null; then break; fi
            if [ "$attempt" = "30" ]; then cat /tmp/coolink-app.log; exit 1; fi
            sleep 1
          done
          npm run test:smoke:rls
          npm run test:smoke:admin
          node scripts/verifyLoyaltySmoke.cjs
          node node_modules/playwright/cli.js install --with-deps chromium
          npm run test:browser
      - name: Browser test report (no traces or credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  backup-snapshot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: snapshot-test
          POSTGRES_DB: source
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify backup during concurrent writes
        env:
          DATABASE_DIRECT_URL: postgresql://postgres:snapshot-test@localhost:5432/source
          PGPASSWORD: snapshot-test
        run: |
          # Use the container's matching PostgreSQL 17 tools, not the runner client.
          mkdir -p /tmp/pg17-tools
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker exec -i -e PGDATABASE -e PGPASSWORD -e PGHOST -e PGPORT -e PGUSER -e PGSSLMODE %s %s "$@"\n' "${{ job.services.postgres.id }}" "$tool" > "/tmp/pg17-tools/$tool"
            chmod +x "/tmp/pg17-tools/$tool"
          done
          export PATH="/tmp/pg17-tools:$PATH"
          psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE "Client" (id int, "supabaseUserId" text); CREATE TABLE "TattooProject" (id int); CREATE TABLE "Appointment" (id int); CREATE SCHEMA auth; CREATE TABLE auth.users (id uuid PRIMARY KEY); INSERT INTO auth.users VALUES ('"'"'11111111-1111-4111-8111-111111111111'"'"'); INSERT INTO "Client" VALUES (0, '"'"'11111111-1111-4111-8111-111111111111'"'"'); CREATE SCHEMA storage; CREATE TABLE storage.objects (id int); INSERT INTO storage.objects VALUES (1);'
          (for i in $(seq 1 80); do psql "$DATABASE_DIRECT_URL" -q -c 'INSERT INTO "Client" (id) VALUES (1)' >/dev/null; sleep 0.05; done) &
          WRITER=$!
          node scripts/backupDatabase.mjs
          wait "$WRITER"
          docker cp "${{ job.services.postgres.id }}:production.dump" production.dump
          psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE restored'
          docker exec -e PGPASSWORD "${{ job.services.postgres.id }}" pg_restore --exit-on-error --clean --if-exists -h localhost -U postgres -d restored --no-owner --no-privileges production.dump
          docker exec -e PGPASSWORD "${{ job.services.postgres.id }}" pg_restore --exit-on-error -h localhost -U postgres -d restored --no-owner --no-privileges protected.dump
          psql postgresql://postgres@localhost:5432/restored -XqAt -v ON_ERROR_STOP=1 -f scripts/backupProtectedCounts.sql > protected.actual
          LC_ALL=C sort protected-counts.txt > protected.expected.sorted
          LC_ALL=C sort protected.actual > protected.actual.sorted
          diff protected.expected.sorted protected.actual.sorted
          psql postgresql://postgres@localhost:5432/restored -XqAt -v ON_ERROR_STOP=1 -f scripts/backupCounts.sql > actual.txt
          LC_ALL=C sort expected-counts.txt > expected.sorted
          LC_ALL=C sort actual.txt > actual.sorted
          diff expected.sorted actual.sorted
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
